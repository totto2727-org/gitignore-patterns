name: Publish to npm

on:
  push:
    branches: [main]

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: totto2727-org/monorepo/.github/actions/setup-nix@main
      - uses: totto2727-org/monorepo/.github/actions/setup-typescript@main
      - name: Build npm artifact
        run: |
          eval "$(nix print-dev-env "$GITHUB_WORKSPACE#default")"
          vp pack
      - uses: totto2727-org/monorepo/.github/actions/publish-npm@main
        with:
          working-directory: .
