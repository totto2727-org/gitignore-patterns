name: Publish to npm

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: totto2727-org/monorepo/.github/actions/setup-nix@main
      - uses: totto2727-org/monorepo/.github/actions/setup-typescript@main
      - name: Verify release tag and build npm artifact
        run: |
          eval "$(nix print-dev-env "$GITHUB_WORKSPACE#default")"
          expected_tag="v$(node -p "require('./package.json').version")"
          if [[ "$GITHUB_REF_NAME" != "$expected_tag" ]]; then
            echo "::error::Release tag must match package.json version ($expected_tag)"
            exit 1
          fi
          vp pack
      - name: Publish with npm trusted publishing
        run: |
          eval "$(nix print-dev-env "$GITHUB_WORKSPACE#default")"
          npm publish --provenance --access public --registry=https://registry.npmjs.org/
